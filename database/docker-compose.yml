version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: antigravity_postgres
    restart: always
    environment:
      POSTGRES_USER: antigravity_user
      POSTGRES_PASSWORD: anti_gravity_secret_2050
      POSTGRES_DB: antigravity_waste_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql

  pgadmin:
    image: dpage/pgadmin4
    container_name: antigravity_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@antigravity.city
      PGADMIN_DEFAULT_PASSWORD: admin_secret_pass
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  postgres_data:
